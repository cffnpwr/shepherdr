[workspace]
resolver = "3"
members = ["crates/shepherdr-app", "crates/shepherdr-core"]

[workspace.package]
version = "0.0.0"
edition = "2024"

[workspace.dependencies]
log = "=0.4.33"
rustc-hash = "=2.1.3"
serde = { version = "=1.0.228", features = ["derive"] }
tauri = "=2.11.5"
thiserror = "=2.0.18"
tokio = { version = "=1.53.1", default-features = false }

[workspace.lints.clippy]
# restriction lints (opt-in individually)
absolute_paths = "deny"
all = "deny"
allow_attributes_without_reason = "deny"
clone_on_ref_ptr = "deny"
manual_assert = "deny"
mod_module_files = "deny"
panic = "deny"
pedantic = "deny"
unused_trait_names = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
warnings = "deny"
