name: Release Please
on:
  push:
    branches:
      - main

concurrency:
  group: >-
    ${{ github.workflow }}-
    ${{ github.repository }}-
    ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-metadata: read
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: ${{ github.ref_name }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

      # release-please は Cargo.toml のバージョンを更新するが、Cargo.lock の
      # workspace member のエントリは更新しない。放置するとリリース後に
      # Cargo.toml と Cargo.lock が食い違うため、リリースPRのブランチ上で同期する。
      - name: Checkout release PR branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Install Rust toolchain
        if: ${{ steps.release.outputs.pr }}
        run: rustup show active-toolchain || rustup toolchain install

      - name: Sync Cargo.lock workspace versions
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          REPO: ${{ github.repository }}
        run: |
          cargo update --workspace
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already in sync"
            exit 0
          fi
          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: sync Cargo.lock workspace versions"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:${BRANCH}"

  build:
    name: Build app bundle
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    timeout-minutes: 60
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Install frontend dependencies
        working-directory: frontend
        run: mise exec -- bun install --frozen-lockfile

      - name: Build app bundle
        run: mise run build

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dmg-aarch64-apple-darwin
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - release-please
      - build
    permissions:
      contents: read
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: dmg-*
          merge-multiple: true

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write

      - name: Attach bundles and publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |-
          set -eu
          cd dist
          sha256sum ./*.dmg > checksums.txt
          gh release upload "$TAG_NAME" ./*.dmg checksums.txt
          gh release edit "$TAG_NAME" --draft=false
